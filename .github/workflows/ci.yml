name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore spawner.sln
      - name: Test
        run: dotnet test spawner.sln --no-restore --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/spawner
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "12.21.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: Frontend/spawner/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
